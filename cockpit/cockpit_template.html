<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriConnect Pastoral Early Warning Cockpit v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css'">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';document.head.appendChild(s);"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"
        onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js';document.head.appendChild(s);"></script>
<style>
  :root{
    --bg:#12181B; --panel:#1A2126; --panel-2:#20282D; --border:#333D42; --border-soft:#2A3237;
    --text:#E9E4D8; --text-muted:#9AA3A8; --text-dim:#6C767B;
    --severe:#C0463B; --high:#D98B3F; --modhigh:#D9A34A; --moderate:#D9BC55; --favourable:#6B9C5C; --nodata:#4A5257;
    --accent:#4FA8C9; --accent-dim:#2E4E5A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif;}
  body{padding:28px 32px 60px;}
  .mono{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;}
  h1,h2,h3{font-family:'Space Grotesk','IBM Plex Sans Arabic',sans-serif;margin:0;letter-spacing:-0.01em;}

  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
  header h1{font-size:26px;font-weight:600;}
  header .sub{color:var(--text-muted);font-size:14px;margin-top:6px;max-width:640px;line-height:1.5;}
  .dekad-badge{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;font-size:13px;color:var(--accent);border:1px solid var(--accent-dim);background:rgba(79,168,201,0.08);padding:7px 14px;white-space:nowrap;} .dekad-badge.secondary{color:var(--text-muted);border:1px solid var(--border);background:rgba(255,255,255,0.03);font-size:11.5px;padding:6px 14px;}
  .badge-stack{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}

  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);margin-bottom:26px;border:1px solid var(--border);}
  .stat{background:var(--panel);padding:18px 20px;}
  .stat .num{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;font-size:28px;font-weight:600;line-height:1;}
  .stat .lbl{color:var(--text-muted);font-size:12.5px;margin-top:8px;line-height:1.4;}
  .stat.sev .num{color:var(--severe);} .stat.hi .num{color:var(--high);} .stat.acc .num{color:var(--accent);} .stat.fav .num{color:var(--favourable);}

  .layout{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px;}
  @media (max-width:980px){.layout{grid-template-columns:1fr;}}
  .panel{background:var(--panel);border:1px solid var(--border);}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;}
  .panel-head h2{font-size:15px;font-weight:600;}
  .panel-head .note{font-size:11.5px;color:var(--text-dim);}
  .panel-body{padding:0;}
  .panel-body.pad{padding:18px;}

  #map{height:560px;background:var(--panel-2);direction:ltr;}
  .leaflet-container{background:var(--panel-2);font-family:'IBM Plex Sans',sans-serif;}
  .map-controls{padding:10px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .btn{background:var(--panel-2);border:1px solid var(--border);color:var(--text-muted);font-size:12px;padding:6px 12px;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;}
  .btn:hover{color:var(--accent);border-color:var(--accent-dim);}
  .btn.active{color:var(--accent);border-color:var(--accent);}
  .breadcrumb{font-size:12.5px;color:var(--text-muted);}
  .breadcrumb b{color:var(--text);}

  #detail-name{font-size:20px;font-weight:600;}
  #detail-sub{color:var(--text-muted);font-size:13px;margin-top:2px;}
  .kv-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13.5px;}
  .kv-row .k{color:var(--text-muted);}
  .kv-row .v{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;}
  .tier-pill{display:inline-block;padding:3px 10px;font-size:11.5px;font-weight:600;font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;}
  .action-box{margin-top:14px;padding:12px 14px;background:var(--panel-2);border-inline-start:3px solid var(--accent);font-size:13.5px;line-height:1.5;}
  .data-flag{margin-top:10px;padding:8px 12px;background:rgba(217,169,74,0.1);border-inline-start:3px solid var(--nodata);font-size:12px;color:var(--text-muted);}
  canvas{max-width:100%;}

  .alert-log{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;font-size:12px;line-height:1.85;max-height:320px;overflow-y:auto;}
  .alert-log .row{display:flex;gap:10px;padding:6px 18px;border-bottom:1px solid var(--border-soft);}
  .alert-log .badge{padding:1px 7px;font-size:10px;font-weight:600;height:fit-content;white-space:nowrap;}
  .b-critical{background:var(--severe);color:#FBEFEA;} .b-high{background:var(--high);color:#231705;}
  .b-medium{background:var(--modhigh);color:#241a05;} .b-info{background:var(--accent-dim);color:var(--accent);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:start;font-weight:600;color:var(--text-muted);font-size:11.5px;padding:8px 18px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
  th:hover{color:var(--accent);}
  td{padding:9px 18px;border-bottom:1px solid var(--border-soft);}
  td.num,th.num{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;text-align:end;}
  tr:hover td{background:rgba(79,168,201,0.05);cursor:pointer;}

  .decision{border:1px solid var(--border);border-inline-start:4px solid var(--accent);background:var(--panel);margin-bottom:22px;}
  .decision .panel-head{border-bottom:1px solid var(--border);}
  .decision-msg{padding:16px 20px 6px;font-size:14.5px;line-height:1.7;color:var(--text);}
  .decision-msg p{margin:0 0 10px;}
  .decision-actions{padding:4px 20px 8px;}
  .dec-row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--border-soft);font-size:13.5px;line-height:1.6;}
  .dec-tag{flex:0 0 78px;text-align:center;padding:2px 0;font-size:10.5px;font-weight:600;font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;letter-spacing:0.02em;}
  .dec-tag.act{background:var(--severe);color:#FBEFEA;} .dec-tag.watch{background:var(--modhigh);color:#241a05;} .dec-tag.check{background:var(--favourable);color:#0f1a0c;}
  .decision-basis{padding:8px 20px 14px;font-size:11.5px;color:var(--text-dim);line-height:1.6;}
  .trend-layout{display:grid;grid-template-columns:1fr 1.35fr;}
  @media (max-width:980px){.trend-layout{grid-template-columns:1fr;}}
  .trend-board{border-inline-end:1px solid var(--border);max-height:430px;overflow-y:auto;}
  @media (max-width:980px){.trend-board{border-inline-end:none;border-bottom:1px solid var(--border);}}
  .trend-board table{font-size:12.5px;}
  .trend-board td,.trend-board th{padding:8px 12px;}
  .trend-board tr.sel td{background:rgba(79,168,201,0.10);}
  .dir{display:inline-block;padding:2px 9px;font-size:11px;font-weight:600;font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;}
  .dir.worse{background:var(--severe);color:#FBEFEA;} .dir.better{background:var(--favourable);color:#0f1a0c;} .dir.stable{background:#3a444a;color:var(--text-muted);}
  .delta-neg{color:#E58A80;} .delta-pos{color:#8FC37E;}
  .trend-chart-wrap{padding:16px 18px;}
  .trend-chart-title{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin-bottom:2px;}
  .trend-chart-sub{font-size:12px;color:var(--text-muted);margin-bottom:8px;line-height:1.5;}
  .trend-legend{font-size:11px;color:var(--text-dim);margin-top:8px;line-height:1.6;}
  .engine-note{font-family:'IBM Plex Mono','IBM Plex Sans Arabic',monospace;font-size:11px;color:var(--text-dim);padding:12px 18px;border-top:1px solid var(--border);}
  footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--border);color:var(--text-dim);font-size:11.5px;line-height:1.7;}
  footer b{color:var(--text-muted);}
  footer a{color:var(--accent);text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  .lang-switch{display:flex;border:1px solid var(--border);align-self:flex-end;}
  .lang-btn{background:var(--panel-2);color:var(--text-muted);border:0;border-inline-start:1px solid var(--border);padding:6px 14px;font-size:12px;cursor:pointer;font-family:'IBM Plex Sans','IBM Plex Sans Arabic',sans-serif;}
  .lang-btn:first-child{border-inline-start:0;}
  .lang-btn:hover{color:var(--accent);}
  .lang-btn.active{background:var(--accent);color:#0b1215;font-weight:600;}
  .lang-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  footer > div{margin-bottom:4px;}
</style>
</head>
<body>

<header>
  <div>
    <h1 data-i18n="title"></h1>
    <div class="sub" data-i18n="subtitle"></div>
  </div>
  <div class="badge-stack">
    <div class="lang-switch" role="group" aria-label="Language / Langue / اللغة">
      <button type="button" class="lang-btn" data-lang="en" lang="en">English</button>
      <button type="button" class="lang-btn" data-lang="fr" lang="fr">Français</button>
      <button type="button" class="lang-btn" data-lang="ar" lang="ar">العربية</button>
    </div>
    <div class="dekad-badge" id="dekad-badge" data-i18n-title="badge.dekadTitle"></div>
    <div class="dekad-badge secondary" id="resource-touched-badge" style="display:none;" data-i18n-title="badge.touchedTitle"></div>
  </div>
</header>

<div class="strip" id="strip"></div>

<div class="decision" id="decision-panel">
  <div class="panel-head">
    <h2 data-i18n="dec.title"></h2>
    <span class="note" data-i18n="dec.note"></span>
  </div>
  <div class="decision-msg" id="decision-msg"></div>
  <div class="decision-actions" id="decision-actions"></div>
  <div class="decision-basis" id="decision-basis"></div>
</div>

<div class="layout">
  <div class="panel">
    <div class="panel-head">
      <h2 data-i18n="map.title"></h2>
      <span class="breadcrumb" id="breadcrumb"></span>
    </div>
    <div class="panel-body">
      <div id="map"></div>
      <div class="map-controls">
        <span style="font-size:11.5px;color:var(--text-dim)" data-i18n="map.bounds"></span>
        <button class="btn" id="back-btn" style="display:none" data-i18n="btn.back"></button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2 id="detail-name"></h2></div>
    <div class="panel-body pad">
      <div id="detail-sub" style="margin-bottom:10px;"></div>
      <div id="detail-kv"></div>
      <div id="no-data-flag"></div>
      <canvas id="trendChart" height="130" style="margin-top:14px;"></canvas>
      <div class="action-box" id="action-box"></div>
    </div>
  </div>
</div>

<div class="panel" id="trend-panel" style="margin-bottom:20px;">
  <div class="panel-head">
    <h2 data-i18n="trend.title"></h2>
    <span class="note" data-i18n="trend.note"></span>
  </div>
  <div class="panel-body" id="trend-body">
    <div class="trend-layout" id="trend-layout">
      <div class="trend-board">
        <table id="trendTable">
          <thead><tr>
            <th data-i18n="trend.col.wilaya"></th><th class="num" data-i18n="trend.col.start"></th><th class="num" data-i18n="trend.col.latest"></th><th class="num" data-i18n="trend.col.change"></th><th data-i18n="trend.col.last3"></th>
          </tr></thead>
          <tbody id="trendBody"></tbody>
        </table>
      </div>
      <div class="trend-chart-wrap">
        <div class="trend-chart-title" id="trendChartTitle"></div>
        <div class="trend-chart-sub" id="trendChartSub"></div>
        <div id="scoreTrendBox" style="direction:ltr;"><canvas id="scoreTrendChart" height="190"></canvas></div>
        <div class="trend-legend" data-i18n="trend.legend"></div>
      </div>
    </div>
    <div id="trend-empty" style="display:none;padding:24px;color:var(--text-muted);font-size:12.5px;line-height:1.7;" data-i18n="trend.empty"></div>
  </div>
</div>

<div class="layout">
  <div class="panel">
    <div class="panel-head">
      <h2 data-i18n="mat.title"></h2>
      <span class="note" data-i18n="mat.note"></span>
    </div>
    <div class="panel-body pad">
      <div id="matrixBox" style="direction:ltr;"><canvas id="matrixChart" height="230"></canvas></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <h2 data-i18n="alert.title"></h2>
      <span class="note" id="alert-count"></span>
    </div>
    <div class="panel-body">
      <div class="alert-log" id="alertLog"></div>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-head">
    <h2 data-i18n="prio.title"></h2>
    <span class="note" data-i18n="prio.note"></span>
  </div>
  <div class="panel-body">
    <table id="priorityTable">
      <thead>
        <tr>
          <th data-key="wilaya" data-i18n="prio.col.wilaya"></th>
          <th data-key="real_tier" data-i18n="prio.col.tier"></th>
          <th data-key="real_score" class="num" data-i18n="prio.col.score"></th>
          <th data-key="psvi" class="num" data-i18n="prio.col.psvi"></th>
          <th data-key="tlu" class="num" data-i18n="prio.col.tlu"></th>
        </tr>
      </thead>
      <tbody id="priorityBody"></tbody>
    </table>
  </div>
  <div class="engine-note" id="engine-note" style="direction:ltr;"></div>
</div>

<footer>
  <div data-i18n-html="foot.what"></div>
  <div data-i18n-html="foot.pipe"></div>
  <div data-i18n-html="foot.src"></div>
</footer>

<script>
const BUNDLE = __BUNDLE_JSON__;

// ================== translations ==================
// Every visible string lives here. {placeholders} are filled by t(key, vars).
// French and Arabic were drafted for this dashboard and should be read over by a
// native speaker who works with these terms before wide circulation.
const LANGS = {
  en: {short:'EN', dir:'ltr', locale:'en'},
  fr: {short:'FR', dir:'ltr', locale:'fr'},
  ar: {short:'AR', dir:'rtl', locale:'en'}   // Arabic keeps Western digits, as is usual in Mauritania
};

const WN_AR = {
  'Adrar':'أدرار', 'Assaba':'لعصابة', 'Brakna':'لبراكنة', 'Dakhlet Nouadhibou':'داخلت نواذيبو',
  'Gorgol':'كوركول', 'Guidimakha':'كيدي ماغا', 'Hodh Chargui':'الحوض الشرقي', 'Hodh El Gharbi':'الحوض الغربي',
  'Inchiri':'إنشيري', 'Tagant':'تكانت', 'Tiris Zemmour':'تيرس زمور', 'Trarza':'اترارزة', 'Nouakchott':'نواكشوط'

  fr:['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'],

};

const I18N = {
en: {
  'title': `AgriConnect Pastoral early warning cockpit — v2`,

  'tier.FAVOURABLE': `FAVOURABLE`, 'tier.NO DATA': `NO DATA`,

  'alert.dirW': `worsened`, 'alert.dirI': `improved`,

// ================== language engine ==================
let LANG = 'en';
function t(key, v){
  let s = (I18N[LANG] && I18N[LANG][key] !== undefined) ? I18N[LANG][key]
        : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if(v) s = s.replace(/\{(\w+)\}/g, (m, k) => (v[k] !== undefined ? v[k] : m));
  return s;
}
const isRTL = () => LANGS[LANG].dir === 'rtl';
const wn = name => (LANG === 'ar' && WN_AR[name]) ? WN_AR[name] : name;
const tierName = c => t('tier.' + c);
const lc = s => LANG === 'ar' ? s : s.toLowerCase();
function fx(v, d){
  if(v === null || v === undefined || Number.isNaN(Number(v))) return '—';
  const s = Number(v).toFixed(d);
  return LANG === 'fr' ? s.replace('.', ',') : s;
}
const fxs = s => LANG === 'fr' ? String(s).replace('.', ',') : String(s);   // for numbers already formatted as text
function fmtNum(n){ return (n === null || n === undefined) ? '—' : Number(n).toLocaleString(LANGS[LANG].locale); }
function initialLang(){
  try { const q = new URLSearchParams(location.search).get('lang'); if(q && LANGS[q]) return q; } catch(e) {}
  try { const s = localStorage.getItem('agriconnect_lang'); if(s && LANGS[s]) return s; } catch(e) {}
  return 'en';
}
function setLang(l){
  if(!LANGS[l]) return;
  LANG = l;
  try { localStorage.setItem('agriconnect_lang', l); } catch(e) {}
  applyLang();
}
function applyStatic(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANGS[LANG].dir;
  document.title = t('doctitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('.lang-btn').forEach(b => {
    const on = b.dataset.lang === LANG;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}

  'FAVOURABLE':'#6B9C5C','NO DATA':'#4A5257'
};
function tierColor(x){ return TIER_COLOR[x] || '#4A5257'; }
function tierPill(tier){
  const dark = (tier === 'MODERATE' || tier === 'MODERATE-HIGH');
  return `<span class="tier-pill" style="background:${tierColor(tier)};color:${dark ? '#241a05' : '#fff'}">${tierName(tier || 'NO DATA')}</span>`;

// ================== resilience helpers ==================
function waitForGlobal(name, timeoutMs, onReady, onTimeout) {
  const start = Date.now();
  (function poll() {
    if (typeof window[name] !== 'undefined') { onReady(); return; }
    if (Date.now() - start > timeoutMs) { onTimeout(); return; }
    setTimeout(poll, 150);
  })();
}
function libFailureNotice(labelKey) {
  return `<div style="padding:24px;color:var(--text-muted);font-size:12.5px;line-height:1.7;text-align:center;">${t('lib.fail', {label: t(labelKey)})}</div>`;
}

function styleFeature(tier){ return {fillColor: tierColor(tier), weight:1, color:'#12181B', fillOpacity:0.85}; }
function renderBreadcrumb(){
  const arrow = isRTL() ? '&larr;' : '&rarr;';
  document.getElementById('breadcrumb').innerHTML = currentWilaya
    ? `${t('nat')} ${arrow} <b>${wn(currentWilaya)}</b>` : `<b>${t('nat')}</b>`;
}
function showAdmin1(){
  if(!map) return;
  if(admin2Layer){ map.removeLayer(admin2Layer); admin2Layer = null; }
  if(admin1Layer) map.removeLayer(admin1Layer);
  admin1Layer = L.geoJSON(BUNDLE.admin1_geo, {
    style: f => styleFeature(f.properties.real_tier),
    onEachFeature: (f, layer) => {
      layer.on('click', () => selectWilayaOnMap(f.properties.wilaya));
      layer.on('mouseover', () => layer.setStyle({weight:2.5, color:'#4FA8C9'}));
      layer.on('mouseout', () => layer.setStyle({weight:1, color:'#12181B'}));
    }
  }).addTo(map);
  map.fitBounds(admin1Layer.getBounds(), {padding:[10,10]});
  document.getElementById('back-btn').style.display = 'none';
  currentWilaya = null;
  renderBreadcrumb();
}
function showAdmin2(wilayaName){
  if(!map) return;
  if(admin1Layer){ map.removeLayer(admin1Layer); admin1Layer = null; }
  if(admin2Layer) map.removeLayer(admin2Layer);
  const feats = BUNDLE.admin2_geo.features.filter(f => f.properties.wilaya === wilayaName);
  admin2Layer = L.geoJSON({type:'FeatureCollection', features:feats}, {
    style: f => styleFeature(f.properties.real_tier),
    onEachFeature: (f, layer) => {
      layer.on('click', () => selectMoughataaOnMap(f.properties.adm2_pcode));

      layer.on('mouseout', () => layer.setStyle({weight:1, color:'#12181B'}));

  currentWilaya = wilayaName;
  renderBreadcrumb();
}

  if(tier === 'HIGH') return t('rec.high');

  if(tier === 'FAVOURABLE') return t('rec.fav');

// ================== alerts ==================
function localizeAlert(a){
  if(LANG === 'en') return a.message;
  const m = a.message || '';
  const unit = a.level === 'admin1' ? wn(a.unit) : a.unit;
  let r;
  if(a.type === 'tier_change' && (r = m.match(/risk tier (worsened|improved) from (.+?) to (.+?) \(score ([\d.]+) -> ([\d.]+)\)/))){
    return t('alert.tier', {u:unit, dir:t(r[1] === 'worsened' ? 'alert.dirW' : 'alert.dirI'),
      p:tierName(r[2].trim()), c:tierName(r[3].trim()), a:fxs(r[4]), b:fxs(r[5])});
  }
  if(a.type === 'severe_entry' && (r = m.match(/\(score ([\d.]+)\) as of (\d{4}-\d{2}-\d{2})/))){
    return t('alert.severe', {u:unit, x:fxs(r[1]), d:r[2]});
  }
  if(a.type === 'psvi_alert' && (r = m.match(/entered VERY HIGH \(([\d.]+)\)/))){
    return t('alert.psvi', {u:unit, v:fxs(r[1])});
  }
  return a.message;
}
function renderAlerts(){
  document.getElementById('alert-count').textContent = t('alert.count', {n: BUNDLE.alerts.length});
  const log = document.getElementById('alertLog');
  log.innerHTML = '';
  const sevRank = {critical:0, high:1, medium:2, info:3};
  [...BUNDLE.alerts].sort((a, b) => sevRank[a.severity] - sevRank[b.severity]).forEach(a => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span class="badge b-${a.severity}">${t('sev.' + a.severity)}</span><span dir="auto">${localizeAlert(a)}</span>`;
    log.appendChild(row);
  });
}

// ================== priority table ==================
function renderTable(){
  const tbody = document.getElementById('priorityBody');
  const rows = [...BUNDLE.state.admin1].filter(d => d.wilaya !== 'Nouakchott').sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if(typeof av === 'string'){ return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av); }
    av = av === null || av === undefined ? -Infinity : av; bv = bv === null || bv === undefined ? -Infinity : bv;
    return sortAsc ? av - bv : bv - av;
  });
  tbody.innerHTML = rows.map(d => `
    <tr data-wilaya="${d.wilaya}">
      <td>${wn(d.wilaya)}</td>
      <td>${tierPill(d.real_tier)}</td>
      <td class="num">${fx(d.real_score, 2)}</td>
      <td class="num">${fx(d.psvi, 2)}</td>
      <td class="num">${fmtNum(Math.round(d.tlu))}</td>
    </tr>`).join('');
  tbody.querySelectorAll('tr').forEach(tr => tr.addEventListener('click', () => { showAdmin2(tr.dataset.wilaya); selectWilaya(tr.dataset.wilaya); }));
}

// ================== season trend panel ==================
const TIER_LINES = [{y:1.75, c:'#C0463B'}, {y:2.75, c:'#D98B3F'}, {y:3.25, c:'#D9A34A'}, {y:4.0, c:'#D9BC55'}];
const shortDate = d => d.slice(5);
function fmtDelta(v){
  if(v === null || v === undefined) return '<span>—</span>';
  const cls = v <= -0.25 ? 'delta-neg' : (v >= 0.25 ? 'delta-pos' : '');
  return `<span class="${cls}">${v > 0 ? '+' : ''}${fx(v, 2)}</span>`;
}
function dirPill(label){
  const cls = label === 'Worsening' ? 'worse' : (label === 'Improving' ? 'better' : 'stable');
  return `<span class="dir ${cls}">${t('dir.' + label)}</span>`;
}
function renderTrendBoard(){
  const body = document.getElementById('trendBody');
  const rows = (HIST && HIST.trends) ? HIST.trends : [];
  body.innerHTML = rows.map(r => `
    <tr data-wilaya="${r.wilaya}">
      <td>${wn(r.wilaya)}</td>
      <td class="num">${fx(r.first_score, 2)}</td>
      <td class="num">${fx(r.latest_score, 2)}</td>
      <td class="num">${fmtDelta(r.season_change)}</td>
      <td>${dirPill(r.recent_trend)}</td>
    </tr>`).join('');
  body.querySelectorAll('tr').forEach(tr => tr.addEventListener('click', () => {
    const w = tr.dataset.wilaya; showAdmin2(w); selectWilaya(w);
  }));
}
function markTrendRow(wilaya){
  document.querySelectorAll('#trendBody tr').forEach(tr => tr.classList.toggle('sel', tr.dataset.wilaya === wilaya));
}
function renderScoreTrend(kind, key){
  const layout = document.getElementById('trend-layout');
  const empty = document.getElementById('trend-empty');
  if(!HIST || !HIST.dates || HIST.dates.length < 2){
    layout.style.display = 'none'; empty.style.display = 'block';
    return;
  }
  layout.style.display = ''; empty.style.display = 'none';
  let title, sub, wilaya, hi, parent = null;
  if(kind === 'm' && HIST.admin2[key]){
    const m = HIST.admin2[key];
    wilaya = m.wilaya; hi = m.scores; parent = HIST.admin1[wilaya] || null;
    title = t('trend.mough', {code:key, w:wn(wilaya)});
  } else {
    wilaya = (kind === 'm') ? ((admin2ByPcode[key] || {}).wilaya || key) : key;
    hi = HIST.admin1[wilaya]; title = wn(wilaya);
  }
  markTrendRow(wilaya);
  const row = (HIST.trends || []).find(r => r.wilaya === wilaya);
  const vals = (hi || []).filter(v => v !== null);
  if(vals.length){
    const change = vals[vals.length - 1] - vals[0];
    sub = t('trend.sub', {a:shortDate(HIST.dates[0]), b:shortDate(HIST.dates[HIST.dates.length - 1]),
                          x:fx(vals[0], 2), y:fx(vals[vals.length - 1], 2), c:(change > 0 ? '+' : '') + fx(change, 2)}) +
          (row && kind !== 'm' ? t('trend.subRecent', {t: lc(t('dir.' + row.recent_trend))}) : '');
  } else { sub = t('trend.none'); }
  document.getElementById('trendChartTitle').textContent = title;
  document.getElementById('trendChartSub').textContent = sub;

  const box = document.getElementById('scoreTrendBox');
  if(typeof Chart === 'undefined'){ box.innerHTML = libFailureNotice('lib.chart'); return; }
  if(!document.getElementById('scoreTrendChart')){ box.innerHTML = '<canvas id="scoreTrendChart" height="190"></canvas>'; }
  if(scoreChart){ scoreChart.destroy(); scoreChart = null; }
  const labels = HIST.dates.map(shortDate);
  const datasets = [];
  Object.keys(HIST.admin1).forEach(w => {
    if(w === wilaya && kind !== 'm') return;
    datasets.push({label:wn(w), data:HIST.admin1[w], borderColor:'rgba(154,163,168,0.28)', borderWidth:1,
                   pointRadius:0, tension:0.2, spanGaps:true, order:5});
  });
  if(kind === 'm' && parent){
    datasets.push({label:t('trend.parent', {w:wn(wilaya)}), data:parent, borderColor:'#D9BC55', borderWidth:2, borderDash:[6,3],
                   pointRadius:0, tension:0.2, spanGaps:true, order:2});
  }
  datasets.push({label:title, data:hi, borderColor:'#4FA8C9', backgroundColor:'#4FA8C9', borderWidth:3,
                 pointRadius:3.5, tension:0.2, spanGaps:true, order:1});
  TIER_LINES.forEach(tl => datasets.push({label:'tier ' + tl.y, data:labels.map(() => tl.y), borderColor:tl.c,
                 borderWidth:1, borderDash:[4,4], pointRadius:0, order:6}));
  scoreChart = new Chart(document.getElementById('scoreTrendChart').getContext('2d'), {
    type:'line', data:{labels, datasets},
    options:{
      animation:false,
      plugins:{legend:{display:false}, tooltip:{filter:(item) => !String(item.dataset.label).startsWith('tier ')}},
      scales:{
        x:{ticks:{color:'#6C767B', font:{size:10}}, grid:{color:'#2A3237'}},
        y:{min:0.8, max:5, ticks:{color:'#6C767B', font:{size:10}}, grid:{color:'#2A3237'},
           title:{display:true, text:t('chart.score'), color:'#9AA3A8', font:{size:10}}}
      }
    }
  });
}

// ================== decision panel ==================
// Nothing here is typed text. Every name, number and count comes from BUNDLE.history
// (season trends) and BUNDLE.state (current tiers, PSVI), so the message stays correct
// as each new dekad arrives, and it is written in whichever language is selected.
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function joinList(a){
  if(a.length <= 1) return a.join('');
  if(LANG === 'ar') return a.slice(0, -1).join('، ') + ' و' + a[a.length - 1];
  return a.slice(0, -1).join(', ') + (LANG === 'fr' ? ' et ' : ' and ') + a[a.length - 1];
}
function countWord(n){ const arr = NUMW[LANG]; return (arr && n >= 0 && n <= 20) ? arr[n] : String(n); }
function arWil(n){ return n === 1 ? 'ولاية واحدة' : n === 2 ? 'ولايتان' : (n >= 3 && n <= 10 ? n + ' ولايات' : n + ' ولاية'); }
const monthOf = d => MONTHS[LANG][parseInt(d.slice(5, 7), 10) - 1];

function buildDecision(){
  const wil = BUNDLE.state.admin1.filter(d => d.wilaya !== 'Nouakchott');
  const byName = {}; wil.forEach(d => byName[d.wilaya] = d);
  const sev  = wil.filter(d => d.real_tier === 'SEVERE').map(d => d.wilaya);
  const high = wil.filter(d => d.real_tier === 'HIGH').map(d => d.wilaya);
  const names = a => joinList(a.map(wn));
  const msg = [], actions = [];
  let basis = '';

  if(!HIST || !HIST.trends || !HIST.trends.length){
    msg.push(sev.length === 0 ? t('d.fb0')
           : sev.length === 1 ? t('d.fb1', {l:names(sev)})
           : t('d.fbN', {n:cap(countWord(sev.length)), nWil:arWil(sev.length), l:names(sev)}));
  } else {
    const T = HIST.trends, total = T.length;
    const first = HIST.dates[0], last = HIST.dates[HIST.dates.length - 1];
    const sameMonth = monthOf(first) === monthOf(last);
    const from = sameMonth ? t('d.fromOn', {d:first.slice(5)}) : t('d.fromIn', {m:monthOf(first)});
    const to   = sameMonth ? t('d.toOn', {d:last.slice(5)})   : t('d.toIn', {m:monthOf(last)});

    // 1. how many are worsening
    const worse = T.filter(r => r.season_trend === 'Worsening');
    const cw = {n:cap(countWord(worse.length)), nWil:arWil(worse.length), total:countWord(total)};
    msg.push(worse.length === 0 ? t('d.none')
           : worse.length === total ? t('d.all', cw)
           : worse.length === 1 ? t('d.some1', cw)
           : t('d.some', cw));

    // 2. steepest fall, then the most livestock-pressured wilaya if it is a different one
    const steepest = [...T].sort((a, b) => a.season_change - b.season_change)[0];
    let s2 = '';
    if(steepest && steepest.season_change < 0){
      const cur = byName[steepest.wilaya];
      s2 = t('d.steep', {w:wn(steepest.wilaya), a:fx(steepest.first_score, 2), b:fx(steepest.latest_score, 2), from, to,
                         now: cur ? t('d.now', {t:lc(tierName(cur.real_tier))}) : ''});
    }
    const pressured = [...T].filter(r => byName[r.wilaya] && byName[r.wilaya].psvi != null)
                            .sort((a, b) => byName[b.wilaya].psvi - byName[a.wilaya].psvi)[0];
    if(pressured && (!steepest || pressured.wilaya !== steepest.wilaya) && pressured.season_change < 0){
      s2 += t('d.press', {w:wn(pressured.wilaya), p:fx(byName[pressured.wilaya].psvi, 1),
                          a:fx(pressured.first_score, 2), b:fx(pressured.latest_score, 2), from, to});
    }
    if(s2) msg[0] += ' ' + s2.trim();

    // 3. recent upticks that have not made up the season's loss
    const R = T.filter(r => r.recent_trend === 'Improving' && r.season_change < 0).map(r => r.wilaya);
    const U = T.filter(r => r.season_change > 0).map(r => r.wilaya);
    let s3 = '';
    if(R.length) s3 = t(R.length === 1 ? 'd.tick1' : (R.length === 2 ? 'd.tick2' : 'd.tickN'), {list:names(R)});
    if(U.length === 1) s3 += ' ' + t('d.only', {w:wn(U[0])});
    else if(U.length > 1) s3 += ' ' + t('d.several', {list:names(U)});
    else s3 += ' ' + t('d.noneUp');
    msg.push(s3.trim());

    // what this means: rule-based pointers that mirror the report's priorities
    const pr1 = sev.concat(high);
    if(sev.length && high.length) actions.push({tag:t('d.actTag'), cls:'act', text:t('d.actBoth', {s:names(sev), h:names(high)})});
    else if(sev.length) actions.push({tag:t('d.actTag'), cls:'act', text:t('d.actSev', {s:names(sev)})});
    else if(high.length) actions.push({tag:t('d.actTag'), cls:'act', text:t('d.actHigh', {h:names(high)})});

    const vh = wil.filter(d => d.psvi_tier === 'VERY HIGH' && !pr1.includes(d.wilaya)).map(d => d.wilaya);
    if(vh.length){
      const declining = vh.filter(n => { const r = T.find(x => x.wilaya === n); return r && r.season_trend === 'Worsening'; });
      actions.push({tag:t('d.watchTag'), cls:'watch', text:t(declining.length === vh.length ? 'd.watchDecl' : 'd.watch', {l:names(vh)})});
    }
    if(U.length) actions.push({tag:t('d.checkTag'), cls:'check', text:t(U.length > 1 ? 'd.checkN' : 'd.check1', {l:names(U)})});
    basis = t('d.basis', {n:HIST.dates.length, a:first, b:last, d:BUNDLE.state.as_of});
  }
  basis += t('d.basisTail');
  return {msg, actions, basis};
}
function renderDecision(){
  const d = buildDecision();
  document.getElementById('decision-msg').innerHTML = d.msg.map(p => `<p>${p}</p>`).join('');
  document.getElementById('decision-actions').innerHTML = d.actions.map(a =>
    `<div class="dec-row"><span class="dec-tag ${a.cls}">${a.tag}</span><span>${a.text}</span></div>`).join('');
  document.getElementById('decision-basis').textContent = d.basis;
}

// ================== apply language to everything ==================
function applyLang(){
  applyStatic();
  renderHeader();
  renderStrip();
  renderEngineNote();
  renderBreadcrumb();
  renderAlerts();
  renderTable();
  renderTrendBoard();
  renderDecision();
  renderMatrix();
  if(mapFailed) document.getElementById('map').innerHTML = libFailureNotice('lib.map');
  reselect();
}

// ================== boot ==================
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
document.getElementById('back-btn').addEventListener('click', showAdmin1);
document.querySelectorAll('#priorityTable th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if(sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; }
    renderTable();
  });
});
LANG = initialLang();
applyLang();
waitForGlobal('L', 6000, () => {
  map = L.map('map', {zoomControl:true, attributionControl:false}).setView([20.5, -10.5], 5.4);
  showAdmin1();
}, () => {
  mapFailed = true;
  document.getElementById('map').innerHTML = libFailureNotice('lib.map');
});

</script>
