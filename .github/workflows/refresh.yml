name: PRAPS2 dekadal refresh

# Runs automatically a couple of days after each HDX dekad publication
# (dekads land on/around the 1st, 11th, and 21st of each month); also
# runs immediately whenever fresh CSVs are dropped into data/manual/
# (see data/manual/README.md - the fallback path if automated fetch
# from HDX isn't working); and can be triggered manually for testing.
on:
  schedule:
    - cron: "0 6 3,13,23 * *"   # 06:00 UTC on the 3rd/13th/23rd - a 2-day buffer after each dekad
  push:
    paths:
      - "data/manual/**"         # manual CSV drop - see data/manual/README.md
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write               # needed to commit the refreshed state/cockpit back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Use manual CSVs if present, otherwise fetch from HDX
        run: |
          mkdir -p data
          if [ -f data/manual/ndvi.csv ] && [ -f data/manual/rainfall.csv ]; then
            echo "Found manually-uploaded CSVs in data/manual/ - using those."
            cp data/manual/ndvi.csv data/ndvi.csv
            cp data/manual/rainfall.csv data/rainfall.csv
          else
            echo "No manual CSVs found - fetching from HDX automatically."
            python3 scripts/fetch_hdx_data.py --out-dir data
          fi

      - name: Locate previous state (for the alert diff)
        id: prev
        run: |
          if [ -f output/state_MRT_latest.json ]; then
            cp output/state_MRT_latest.json output/state_MRT_previous.json
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build state + bundle from fresh data
        id: bundle
        run: |
          python3 scripts/build_bundle.py \
            --config config/countries/mrt.json \
            --prev-state output/state_MRT_previous.json \
            --admin1-geo cockpit/admin1.json \
            --admin2-geo cockpit/admin2.json \
            --fetch-manifest data/fetch_manifest.json \
            --out-dir output \
            --bundle-out cockpit/bundle.json
          echo "changed=$(cat bundle_changed.flag)" >> "$GITHUB_OUTPUT"

      - name: Render the cockpit HTML
        if: steps.bundle.outputs.changed == 'true'
        run: |
          python3 scripts/render_cockpit.py \
            --template cockpit/cockpit_template.html \
            --bundle cockpit/bundle.json \
            --out cockpit/praps2_cockpit_v2.html
          mkdir -p deploy
          cp cockpit/praps2_cockpit_v2.html deploy/index.html

      - name: Generate the CH technical-input packet
        if: steps.bundle.outputs.changed == 'true'
        run: |
          LATEST_STATE=$(ls -t output/state_MRT_20*.json | head -1)
          python3 ch_packet/generate_ch_packet.py \
            --state "$LATEST_STATE" \
            --prev-state output/state_MRT_previous.json \
            --out "output/CH_Packet_$(date +%Y%m%d).docx"

      - name: Post alert summary to Slack (no-ops if secret is unset)
        if: steps.bundle.outputs.changed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          LATEST_STATE=$(ls -t output/state_MRT_20*.json | head -1)
          python3 bot/alert_bot.py \
            --prev output/state_MRT_previous.json \
            --curr "$LATEST_STATE" \
            --slack-webhook "$SLACK_WEBHOOK_URL"

      - name: Commit refreshed data back to the repo
        if: steps.bundle.outputs.changed == 'true'
        run: |
          git config user.name "praps2-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ cockpit/bundle.json cockpit/praps2_cockpit_v2.html
          git commit -m "Automated dekadal refresh: $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git merge -X ours origin/main --no-edit; then
              if git push; then
                echo "Push succeeded on attempt $i"
                break
              fi
            else
              echo "Merge conflict on attempt $i - aborting and retrying"
              git merge --abort || true
            fi
            echo "Retrying in 5s..."
            sleep 5
          done

      - name: Debug - confirm Netlify secrets actually reach this job
        if: steps.bundle.outputs.changed == 'true'
        env:
          NAT: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NSI: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NAT" ]; then
            echo "NETLIFY_AUTH_TOKEN: EMPTY - not reaching this job at all"
          else
            echo "NETLIFY_AUTH_TOKEN: present, length=${#NAT} characters"
          fi
          if [ -z "$NSI" ]; then
            echo "NETLIFY_SITE_ID: EMPTY - not reaching this job at all"
          else
            echo "NETLIFY_SITE_ID: present, value=$NSI"
          fi

      - name: Deploy to Netlify directly
        if: steps.bundle.outputs.changed == 'true'
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: deploy
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Automated dekadal refresh"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
